  requirement: 学完能沿 main → prepare_and_enter_kernel_image → enter_kernel_image_v1 → arch_boot_resume_v1 走完两条 UEFI 链；能说出九动作表里读文件、ExitBootServices、提交分类计数与跳转各在哪一步；能指出
