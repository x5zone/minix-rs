  topic: 6. 诊断
  requirement: 学完能按 ExitBootServices 分界判断一条输出该走固件控制台还是裸串口；能用里程碑清单把 boot-shim 的动作切开并定位串口停在哪一段；能按“看输出 → 看异常 → 看页表走查”三层抓现场。
