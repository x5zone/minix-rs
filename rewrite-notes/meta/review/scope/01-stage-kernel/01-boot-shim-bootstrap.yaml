  topic: 5. 测试：四条不变量各自的证据
  requirement: 学完能按 I1–I4 说出每条不变量各自的宿主证据与真机证据，并说出每条证据“不证明什么”；能用真机门脚本的关键路标判断一条链走到了哪一步。
  chapters:
  - '5'
