name: rules-consistency

# 工作流自检门常驻化。
#
# 为什么需要：改规则的人同时也是写规则的人，四条命令此前只靠自觉执行。本仓已出现过
# 「源改了、派生副本没跟」「规则引用一个从未存在的脚本」「门把自己的历史输出当成新命中」
# 三类缺陷，都需要一个不依赖记忆的兜底。
#
# 门禁本身也被测：`lint-review-rules.sh --self-test` 用夹具驱动同一套判据做正反向断言，
# 因此「门恒绿」和「门恒红」都会让本工作流失败，而不是静默通过。
#
# 扫描域只含受版本管理的文件（`git ls-files`），所以独立审阅方写进 `prompt/<审计方>/`
# 的报告与捕获的门输出不会参与判定——否则审计窗口期内必然假红。
#
# 不在此工作流里的：增量文风门（doc-style-lint --diff）。它需要与 base 提交比较，
# 且笔记树的存量还在治理中，接入前需单独决定失败策略。

on:
  push:
    paths:
      - 'prompt/**'
      - 'os/**'
      - '.claude/**'
      - '.codex/**'
      - '.trae/**'
      - '.agents/**'
      - 'tools/**'
      - 'rewrite-notes/01-stage-kernel/**'
      - 'rewrite-notes/02-stage-vm/**'
      - 'rewrite-notes/03-stage-rs/**'
      - 'rewrite-notes/meta/coordination/review-eval/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/**'
      - 'opencode.json'
      - '.github/workflows/rules-consistency.yml'
  pull_request:
    paths:
      - 'prompt/**'
      - 'os/**'
      - '.claude/**'
      - '.codex/**'
      - '.trae/**'
      - '.agents/**'
      - 'tools/**'
      - 'rewrite-notes/01-stage-kernel/**'
      - 'rewrite-notes/02-stage-vm/**'
      - 'rewrite-notes/03-stage-rs/**'
      - 'rewrite-notes/meta/coordination/review-eval/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/**'
      - 'opencode.json'
      - '.github/workflows/rules-consistency.yml'
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # 多字节正则工具（doc-ref-check）需 GNU Awk；ubuntu runner 默认 /usr/bin/awk→mawk，
      # 但 gawk 预装——统一 pin AWK=gawk，两工具（density/ref-check）都读 $AWK。
      AWK: gawk
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep python3-yaml

      - name: 确认工具齐备（缺哪个就直接报错，不要让门静默跳过）
        run: |
          for t in git rg python3 awk gawk sed grep; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::缺少必需工具：$t"; exit 1; }
          done
          python3 -c 'import yaml' || { echo "::error::缺少 PyYAML（python3-yaml）"; exit 1; }
          echo "工具 OK：$(git --version | head -1) / $(gawk --version | head -1) / $(python3 --version)"

      - name: 四道一致性门（源 → 三端派生）
        run: |
          echo '── 1/4 规则文本自检（L1-L17）──'
          bash tools/lint-review-rules.sh || { echo '::error::gate failed: lint-review-rules'; exit 1; }
          echo '── 2/4 规范源与运行时引用一致 ──'
          bash tools/check-review-rules.sh || { echo '::error::gate failed: check-review-rules'; exit 1; }
          echo '── 3/4 派生件与源无漂移（含 review-scan 编排器 12 个文件）──'
          bash tools/generate-derived-skills.sh --check || { echo '::error::gate failed: generate-derived-skills --check'; exit 1; }
          echo '── 4/4 Trae 适配逐文件对照 ──'
          bash tools/diff-trae-skills.sh --only-diff || { echo '::error::gate failed: diff-trae-skills'; exit 1; }

      - name: 仓库级门禁（模式门全量 + 命令层边界守卫）
        # 这两个门早已存在但不在任何闸上，所以长期「红着入库」无人拦：
        # pattern-gate 的全量扫描只跑了 `--self-test`（上一项），边界守卫只靠人记得跑。
        # 台账 `rewrite-notes/meta/coordination/TODO-LEDGER-OPEN.md` §7「门不在闸上」一行登的丙子面。
        # 能接进来是因为它俩已被归零：边界守卫 2026-10-12 翻绿（C-84），
        # P8 的 57 个 CRLF 文件也已全部归一（C-85、C-86）。
        run: |
          bash tools/pattern-gate.sh || { echo '::error::gate failed: pattern-gate'; exit 1; }
          bash tools/check-command-boundary.sh || { echo '::error::gate failed: check-command-boundary'; exit 1; }

      - name: 门自身的正反向断言
        run: bash tools/lint-review-rules.sh --self-test

      - name: 门禁工具自测（文风门 / 锚点门 / 承载门 / unsafe 审计 / 模式门 / 断链门 / 表结构门 / clippy 棘轮）
        run: |
          run_self() {
            echo "── $*"
            if ! "$@" > /tmp/selftest.log 2>&1; then
              tail -8 /tmp/selftest.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              echo "::error::self-test failed: $*"
              exit 1
            fi
          }
          run_self bash tools/doc-style-lint.sh --self-test
          run_self bash tools/anchor-resolve.sh --self-test
          run_self bash tools/doc-code-map.sh --self-test
          run_self bash tools/doc-code-density-check.sh --self-test
          run_self bash tools/doc-ref-check.sh --self-test
          run_self bash tools/anchor-migrate.sh --self-test
          run_self bash tools/unsafe-audit.sh --self-test
          run_self bash tools/pattern-gate.sh --self-test
          run_self bash tools/check-clippy-ratchet.sh --self-test
          run_self python3 tools/notes-link-check.py --self-test
          run_self python3 tools/doc-structure-check.py --self-test
          run_self python3 tools/eval-trace-check.py --self-test
          run_self python3 tools/review-units.py --self-test
          run_self python3 tools/notes_layout.py
          run_self python3 tools/trait-audit.py --self-test
          run_self python3 tools/doc-citation-check.py --self-test
          run_self bash tools/doc-symbol-drift.sh --self-test

      - name: 表结构与内部 .md 链接门（P-2）
        # 只扫活账与试点篇目：review-eval/runs/** 是历史轮轨迹，其旧表 schema 不在追溯范围；
        # 当前 run 开始时把该 run 目录加入本步。
        run: |
          python3 tools/doc-structure-check.py \
            rewrite-notes/meta/coordination/review-eval/*.md \
            rewrite-notes/01-stage-kernel/01-boot-shim-bootstrap.md || { echo '::error::gate failed: doc-structure (live artifacts)'; exit 1; }

      - name: 文档引文逐行对账门（V3.2）
        # `代码引用` 与 `节选` 块的每个代码行都必须在源码中找得到（节选只许
        # 省略、不许改写；显式声明 改写/示意/反例 的块豁免）。这是 R25
        # 「引文缺 records_in_wire」与 R30 FACT-B-01（引文停在 let _ =）
        # 一类 P0 的机械替代。
        run: |
          python3 tools/doc-citation-check.py \
            rewrite-notes/01-stage-kernel/01-boot-shim-bootstrap.md --root . || { echo '::error::gate failed: doc-citation'; exit 1; }

      - name: 架构门测试计数门（SD-34 防回长：宿主跑不到的 #[test] 不许静默增减）
        run: |
          python3 tools/arch-gated-test-count.py --self-test
          python3 tools/arch-gated-test-count.py

  publication-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep python3-yaml
      - name: 出版/教程/账本门自测
        run: |
          python3 tools/doc-publication-check.py --self-test
          python3 tools/tutorial-rubric-check.py --self-test
          python3 tools/todo-ledger.py --self-test
      - name: 变更篇目报告（存量 burn-down，不阻断）
        # 先用 report-only 收集存量；存量清零后删除 `|| echo` 的兜底，改为阻断。
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD^"; fi
          docs=$(git diff --name-only "$base" "${{ github.sha }}" -- 'rewrite-notes/*-stage-*/*.md' \
            | grep -E '^rewrite-notes/[0-9]+-stage-[^/]+/[0-9]{2}-[^/]+\.md$' || true)
          if [ -z "$docs" ]; then echo "无变更正式篇目"; exit 0; fi
          for d in $docs; do
            echo "── $d"
            python3 tools/doc-publication-check.py "$d" || echo "::warning::doc-publication: $d（report-only）"
            python3 tools/tutorial-rubric-check.py "$d" --report || echo "::warning::tutorial-rubric: $d（report-only）"
            python3 tools/todo-ledger.py check --doc "$d" || echo "::warning::todo-ledger: $d（report-only）"
            python3 tools/doc-citation-check.py "$d" --root . || echo "::warning::doc-citation: $d（report-only）"
            python3 tools/doc-structure-check.py "$d" || echo "::warning::doc-structure: $d（report-only）"
          done
