[package]
name = "kernel-image"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
walk-hardening = ["minix-arch/walk-hardening"]
# X-2/NK5 裸机隔离：本包 bin 是 no_std 裸机内核镜像（自带 panic_handler 与
# global_allocator），宿主 `--workspace --bins` 必须跳过；真机构建成对传
# `--target <triple> --features fw-<arch>-none`（与 test-kernels
# 同一 fw-* 词汇表）。
#
# `required-features` 是「全部必须开」的语义，没法让两个架构特性各自
# 打开同一个 bin（NK4-B P3 M3.2）。做法：抽出架构无关的内部特性
# `fw-none-image` 由 bin 要求，`fw-x86-none` / `fw-aarch64-none` /
# `fw-riscv64-none` 都隐含它。对外零变化：`os/xtask/src/image.rs:212-222`
# 仍只传 `--features fw-x86-none`；riscv64（P4 M4.2 同形接入）的镜像
# 目前只由 `kernel-image/check-layout.sh riscv64` 取件，不经 xtask 装机
# 面（riscv64 不是 UEFI 盘形，`os/xtask/src/image.rs:195-203` 的 honest
# bail 保持）。链接脚本由
# `--target` 选（见 build.rs），三个架构特性只标记「本架构已被要求
# 产出」；fw-none-image 不单独对外使用，但它被直接打开时的行为与今天
# 在宿主 triple 上传 `fw-x86-none` 同形（裸机 bin 在宿主缺
# `eh_personality` 而编译失败），不构成隔离退化。
fw-none-image = []
fw-x86-none = ["fw-none-image"]
fw-aarch64-none = ["fw-none-image"]
fw-riscv64-none = ["fw-none-image"]

[dependencies]
minix-arch = { path = "../arch", default-features = false }
minix-kernel = { path = "../kernel", default-features = false }
minix-plat = { path = "../plat" }
minix-types = { path = "../libs/minix-types" }
minix-boot = { path = "../libs/minix-boot" }

# NK4-C 续-88 甲案：riscv64 自引导面复用 boot-shim 库的 U-Boot 取件车道
# （BootFileTable/bump 池/build_kernel_info——取页纪律单源，不在镜像侧
# 复制第二份）与 fdt crate（a1 DTB 解 /memory、/chosen）。uefi feature
# 不开：lib 侧 `uefi_helpers` 随之出局，bin 侧 UEFI 入口由
# `required-features = ["fw-uefi-image"]` 门控，不消耗本依赖。只在
# riscv64 target 注入（宿主/x86/aarch64 构建面零变化）。
[target.'cfg(target_arch = "riscv64")'.dependencies]
boot-shim = { path = "../boot-shim", default-features = false, features = ["opensbi"] }
fdt = { workspace = true }

# §续-406：aarch64 自引导面同车道（BootFileTable/magic/build_kernel_info
# 来自 opensbi_helpers 的架构无关半；bump 池本面自有——opensbi_helpers 的
# 池基是 riscv DRAM）。uefi feature 不开，理由同 riscv64 块。
[target.'cfg(target_arch = "aarch64")'.dependencies]
boot-shim = { path = "../boot-shim", default-features = false, features = ["opensbi"] }
fdt = { workspace = true }

# 产出物就是取件契约位的文件名：cargo 对 none 目标产无扩展名工件
# `target/<triple>/<profile>/kernel`，xtask image() 的取件
# 缺省路径与之对齐（os/xtask/src/image.rs kernel_elf_path）。
[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
required-features = ["fw-none-image"]
