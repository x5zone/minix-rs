[package]
name = "test-shutdown-aarch64"
version = "0.1.0"
edition = "2024"

[dependencies]
uefi = { version = "0.33" }
minix-arch = { workspace = true, default-features = false }
minix-plat = { workspace = true }
minix-types = { workspace = true }
minix-boot = { workspace = true }
minix-kernel = { workspace = true, default-features = false }
boot-shim = { workspace = true, features = ["uefi"] }

[[bin]]
name = "test-shutdown-aarch64"
path = "src/main.rs"
test = false
required-features = ["fw-aarch64-uefi"]

# X-2/NK5 裸机隔离：宿主 --workspace --bins 跳过本包；
# 真机构建由 run_all.sh / 特殊脚本 / CI 成对传 --target + --features。
[features]
fw-aarch64-uefi = []
