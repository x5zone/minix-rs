[package]
name = "test-memmap"
version = "0.1.0"
edition = "2024"

[dependencies]
uefi = { version = "0.33", features = ["global_allocator"] }
minix-arch = { workspace = true, default-features = false }
minix-plat = { workspace = true }
minix-types = { workspace = true }
minix-boot = { workspace = true }
boot-shim = { workspace = true, features = ["uefi"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
