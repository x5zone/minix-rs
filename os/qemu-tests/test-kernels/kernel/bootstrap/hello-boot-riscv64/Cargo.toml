[package]
name = "hello-boot-riscv64"
version = "0.1.0"
edition = "2024"

[dependencies]
minix-arch = { workspace = true, default-features = false }
minix-plat = { workspace = true }
minix-types = { workspace = true }
minix-boot = { workspace = true }
minix-kernel = { workspace = true, default-features = false }
boot-shim = { workspace = true, default-features = false, features = ["opensbi"] }

[[bin]]
name = "hello-boot-riscv64"
path = "src/main.rs"
# Bare-metal firmware binary: never compile a host test harness
# (host `cargo test` would link std → duplicate panic_impl /
# global_allocator conflicts with the custom allocator).
test = false
