[package]
name = "test-protection"
version = "0.1.0"
edition = "2024"

[dependencies]
uefi = { version = "0.33", features = ["alloc"] }
# Note: uefi "global_allocator" feature deliberately NOT enabled —
# this test-kernel defines its own #[global_allocator]
# (HybridAllocator). Enabling uefi's would conflict under
# feature unification in host `cargo test` (boot-shim lib test).
minix-arch = { workspace = true, default-features = false }
minix-plat = { workspace = true }
minix-types = { workspace = true }
minix-boot = { workspace = true }
minix-kernel = { workspace = true, default-features = false }
boot-shim = { workspace = true, features = ["uefi"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "test-protection"
path = "src/main.rs"
# Bare-metal firmware binary: never compile a host test harness
# (host `cargo test` would link std → duplicate panic_impl /
# global_allocator conflicts with uefi).
test = false
