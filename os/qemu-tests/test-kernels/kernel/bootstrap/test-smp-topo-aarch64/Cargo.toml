[package]
name = "test-smp-topo-aarch64"
version = "0.1.0"
edition = "2024"

[dependencies]
uefi = { version = "0.33", features = ["alloc"] }
# uefi "global_allocator" feature deliberately NOT enabled — this
# test-kernel defines its own #[global_allocator]. Enabling uefi's
# would conflict under feature unification in host `cargo test`
# (boot-shim lib test).
minix-plat = { workspace = true }
minix-platform = { workspace = true }
minix-types = { workspace = true }
minix-boot = { workspace = true }
boot-shim = { workspace = true, features = ["uefi"] }

[[bin]]
name = "test-smp-topo-aarch64"
path = "src/main.rs"
# Bare-metal firmware binary: never compile a host test harness
# (host `cargo test` would link std → duplicate panic_impl /
# global_allocator conflicts with uefi).
test = false
required-features = ["fw-aarch64-uefi"]

# X-2/NK5 裸机隔离：宿主 --workspace --bins 跳过本包；
# 真机构建由 run_all.sh / 特殊脚本 / CI 成对传 --target + --features。
[features]
fw-aarch64-uefi = []
