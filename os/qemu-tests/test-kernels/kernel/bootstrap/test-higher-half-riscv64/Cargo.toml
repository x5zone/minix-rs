[package]
name = "test-higher-half-riscv64"
version = "0.1.0"
edition = "2021"

[dependencies]
minix-arch = { workspace = true, default-features = false }
minix-plat = { workspace = true }
minix-types = { workspace = true }
minix-boot = { workspace = true }
minix-kernel = { workspace = true, default-features = false, features = ["qemu_test"] }
boot-shim = { workspace = true, default-features = false, features = ["opensbi"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"