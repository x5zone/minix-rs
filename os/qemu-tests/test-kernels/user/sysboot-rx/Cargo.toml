[package]
name = "sysboot-rx"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sysboot-rx"
path = "src/main.rs"
# Freestanding user image: never compile a host test harness (the
# minix-rt `#[panic_handler]` would collide with the std one).
test = false

required-features = ["fw-x86-none"]
[dependencies]
# Inline declaration (not workspace inheritance): this is the one consumer
# that needs `default-features = false` on minix-rt — the freestanding
# no_std birth-chain image (rt-birth precedent).
# T-STAB-1 fix: no `real-trap`. The real trap/kerninfo path is now keyed on
# the freestanding target (minix-sys build.rs `kernel_trap`; minix-rt
# query_kerninfo `target_os = "none"`). Declaring the feature here was
# redundant (this image builds `--target *-none`) and leaked the cfg into
# every hosted test binary via workspace feature unification.
minix-rt = { path = "../../../../libs/minix-rt", default-features = false, features = [
    "panic-handler",
    "alloc-global",
] }
minix-sys = { workspace = true }
minix-types = { workspace = true }

# X-2/NK5 裸机隔离：宿主 --workspace --bins 跳过本包；
# 真机构建由 run_all.sh / 特殊脚本 / CI 成对传 --target + --features。
[features]
fw-x86-none = []
