[package]
name = "minix-rt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_rt"
path = "src/lib.rs"

[dependencies]
minix-sys = { workspace = true }
minix-types = { workspace = true }

[features]
default = ["std"]
std = []
# Opt-in `#[panic_handler]`. The handler must stay a single graph-wide
# instance: a binary that provides its own (e.g. the qemu test-kernels,
# boot-shim) must NOT enable this feature, or E0152 fires. Library
# consumers (minix-kernel) depend on minix-rt without it.
panic-handler = []
