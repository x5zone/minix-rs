[package]
name = "minix-sys"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_sys"
path = "src/lib.rs"

[features]
# Host-side FORCE switch for the real trap legs. Freestanding targets get
# the real traps automatically via `cfg(kernel_trap)` (build.rs — the
# single authority; see its doc comment for the NK4-A fix20 history).
real-trap = []
# Domain-external client modules (E-MINSYS-SCOPE plan A): each feature gates
# one other stage's client library so its protocol evolution cannot leak
# compile-time breakage into the 60+ dependents of this crate. Default keeps
# every module compiled (existing Cargo.toml files need no changes).
ds = []
rmib = []
devman = []
input = []
usb = ["devman"]
socket = []
default = ["ds", "rmib", "devman", "input", "usb", "socket"]

[dependencies]
minix-types = { workspace = true }

[lints.rust]
# `kernel_trap` is emitted by build.rs (freestanding target or the
# real-trap force switch) — see its doc comment.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kernel_trap)'] }
