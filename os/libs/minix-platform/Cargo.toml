[package]
name = "minix-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_platform"
path = "src/lib.rs"

[dependencies]
minix-types = { workspace = true }
minix-boot = { workspace = true }
# Flattened Device Tree parser (no_std, zero-copy). Used by `DeviceTreeDesc`
# to extract CLINT/PLIC/GIC base addresses and timer frequency from a DTB
# blob passed by the boot-shim via `KernelInfo.platform_descriptor`.
fdt = { workspace = true }

[features]
default = []
