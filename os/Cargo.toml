    "drivers/eeprom/cat24c256",
    "drivers/examples/hello",
    "drivers/hid/pckbd",
    "drivers/iommu/amddev",
    "drivers/net/3c90x",
    "drivers/net/atl2",
    "drivers/net/dec21140a",
    "drivers/net/dp8390",
    "drivers/net/dpeth",
    "drivers/net/e1000",
    "drivers/net/fxp",
    "drivers/net/ip1000",
    "drivers/net/lan8710a",
    "drivers/net/lance",
    "drivers/net/rtl8139",
    "drivers/net/rtl8169",
    "drivers/net/virtio_net",
    "drivers/net/vt6105",
    "drivers/power/acpi",
    "drivers/power/tps65217",
    "drivers/power/tps65950",
    "drivers/printer/printer",
    "drivers/sensors/bmp085",
    "drivers/sensors/sht21",
    "drivers/sensors/tsl2550",
    "drivers/storage/ahci",
    "drivers/storage/at_wini",
    "drivers/storage/fbd",
    "drivers/storage/filter",
    "drivers/storage/floppy",
    "drivers/storage/memory",
    "drivers/storage/mmc",
    "drivers/storage/ramdisk",
    "drivers/storage/virtio_blk",
    "drivers/storage/vnd",
    "drivers/system/gpio",
    "drivers/system/log",
    "drivers/system/random",
    "drivers/tty/pty",
    "drivers/tty/tty",
    "drivers/usb/usb_hub",
    "drivers/usb/usb_storage",
    "drivers/usb/usbd",
    "drivers/video/fb",
    "drivers/video/tda19988",
    "drivers/vmm_guest/vbox",

    # 网络（占位，镜像 minix3/minix/net）
    "net/lwip",
    "net/uds",

    # 用户态框架库（占位，镜像 minix3/minix/lib）
    "libs/minix-sef",
    "libs/minix-fs",
    "libs/minix-chardriver",
    "libs/minix-blockdriver",
    "libs/minix-netdriver",
    "libs/minix-vtreefs",
    "libs/minix-sffs",
    "libs/minix-bdev",
    "libs/minix-usb",
    "libs/minix-virtio",
    "libs/minix-devman-client",

    # 游戏命令（占位，镜像 minix3/games）
    "commands/games/adventure",
    "commands/games/arithmetic",
    "commands/games/banner",
    "commands/games/bcd",
    "commands/games/caesar",
    "commands/games/colorbars",
    "commands/games/factor",
    "commands/games/fish",
    "commands/games/fortune",
    "commands/games/monop",
    "commands/games/morse",
    "commands/games/number",
    "commands/games/pig",
    "commands/games/ppt",
    "commands/games/primes",
    "commands/games/rain",
    "commands/games/random",
    "commands/games/wargames",
    "commands/games/worm",
    "commands/games/worms",
    "commands/games/wtf",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["zx5zone"]
license = "MIT"
repository = "https://github.com/minix-rs/os"

[workspace.dependencies]
# 核心库
minix-types = { path = "libs/minix-types" }
minix-boot = { path = "libs/minix-boot" }
minix-sys = { path = "libs/minix-sys" }
minix-rt = { path = "libs/minix-rt" }
minix-elf = { path = "libs/minix-elf" }
minix-platform = { path = "libs/minix-platform" }
minix-fs = { path = "libs/minix-fs" }
minix-arch = { path = "arch", default-features = false }
minix-plat = { path = "plat" }
minix-kernel = { path = "kernel", default-features = false }
boot-shim = { path = "boot-shim", default-features = false }

# 外部依赖
bitflags = "2.4"

# Device Tree Blob parser (no_std, zero-copy) — used by minix-platform
# for DTB-based hardware discovery on ARM64/RISC-V.
fdt = "0.1"

# 构建工具
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# 测试
log = "0.4"

[workspace.metadata.xtask]
kernel-target = "x86_64-minix.json"
user-target = "x86_64-unknown-linux-musl"

# 内核 profile 设置
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
