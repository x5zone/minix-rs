    "commands/bin/cp",
    "commands/bin/echo",
    "commands/bin/ls",
    "commands/bin/mv",
    "commands/bin/rm",
    "commands/bin/sh",
    
    # 用户态命令 - sbin
    "commands/sbin/init",
    "commands/sbin/fsck",
    "commands/sbin/mkfs",
    "commands/sbin/reboot",
    "commands/sbin/devdb",

    # 用户态命令 - usr.bin / usr.sbin（命令安装分层，见 18-stage-commands/99）
    "commands/usr-bin/login",
    "commands/usr-sbin/svcsched",
    
    # 用户态命令 - games
    "commands/games/tetris",
    "commands/games/snake",
    "commands/games/rogue",
    
    # 构建系统
    "xtask",

    # 文件系统服务器（占位，镜像 minix3/minix/fs）
    "fs/mfs",
    "fs/pfs",
    "fs/procfs",
    "fs/ptyfs",
    "fs/ext2",
    "fs/isofs",
    "fs/vbfs",
    "fs/hgfs",

    # 驱动（占位，镜像 minix3/minix/drivers 分类）
    "drivers/audio/als4000",
    "drivers/audio/cmi8738",
    "drivers/audio/cs4281",
    "drivers/audio/es1370",
