[package]
name = "minix-ipc-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "minix-ipc-server"
path = "src/main.rs"

[dependencies]
minix-types = { workspace = true }
# S26:生产 transport 与 IpcBoundary 的 trap 后端(boundary.rs)。
minix-sys = { workspace = true }

# Integration tests (tests/) are separate crates: they can only import
# this package's lib plus dev-dependencies, so the protocol types need
# their own entry here even though the lib already depends on them.
[dev-dependencies]
minix-types = { workspace = true }

[lib]
name = "minix_ipc_server"
path = "src/lib.rs"
