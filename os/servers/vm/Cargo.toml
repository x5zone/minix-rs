[package]
name = "minix-vm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "minix-vm"
path = "src/main.rs"

[dependencies]
minix-types = { workspace = true }
minix-sys = { workspace = true }
# V14-P2-1 (plan A): VM is minix-sef's fourth consumer — the receive half
# of the main loop goes through `sef_receive_status` (ping interception +
# signal classification), same as IS/MIB/devman.
minix-sef = { workspace = true }
# V11/T14: boot-proc ELF loading (exec_bootproc segment parsing);
# the same no_std parser boot-shim uses (loader.rs).
minix-elf = { workspace = true }
# E-VMMOCK (G-V12-5 余件): close the default-features leak — arch's
# `default = ["mock"]` must not enter the VM production build (kernel and
# boot-shim already opt out via the workspace table).
minix-arch = { path = "../../arch", default-features = false }
bitflags = { workspace = true }

[lib]
name = "minix_vm"
path = "src/lib.rs"

[features]
# V11/T16 (G-V11-2): C SANITYCHECKS 的 Rust 对应——编译期开启引用计数
# 全量校验的调用面（run_once 周期执行）。C: alloc.c/region.c SANITYCHECKS。
sanity_checks = []
default = ["bitmap_alloc"]
bitmap_alloc = []
segment_tree_alloc = []
buddy_alloc = []
vmstats = []
vm_acl_audit = []

# minix-rt 双 seam（init 先例；NS8-B/NL5② freestanding 装机面）：
# - 宿主/测试取 std 形态：无 `_start` 也无 panic-handler，宿主二进制与
#   测试图都干净（Scrt1.o 入口）。
# - 真机（`target_os = "none"`，boot 装机模块）取 freestanding 形态。
#   **只取 `panic-handler`，不取 `alloc-global`**：VM 的 lib 自带页池
#   `#[global_allocator]`（VmServer::new 置 PAGE_ALLOC_PTR 后自持供页，
#   VM 本身就是内存管理者），rt 的 slab 池与其 E0152 冲突。
#   `panic-handler` 取 rt 统一 panic 面（L12 形式定形；C panic.c:34-66
#   对位——格式化→诊断钩子→exit(1) 交 PM 收尸、RS 重启服务）。feature
#   只在 none 门下出现：workspace 宿主图统一特性时不会把
#   `#[panic_handler]` 漏进 std 构建（E0152 死结）。
[target.'cfg(not(target_os = "none"))'.dependencies]
minix-rt = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "none")'.dependencies]
minix-rt = { workspace = true, features = ["panic-handler"] }
# NK4-A fix20 定案（stub -EIO 根因）、fix22 收口：真 trap 腿现在由
# minix-sys 的 build.rs 按 target 自动开启（`cfg(kernel_trap)` =
# freestanding ∨ real-trap feature），包级显式声明不再需要——曾经的
# `features = ["real-trap"]` 行正是"每包自选"反模式的第一处补丁。
