[package]
name = "minix-vm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "minix-vm"
path = "src/main.rs"

[dependencies]
minix-ipc = { workspace = true }
minix-sys = { workspace = true }
minix-mock = { workspace = true }
minix-types = { workspace = true }
minix-arch = { path = "../../arch" }
bitflags = { workspace = true }

[lib]
name = "minix_vm"
path = "src/lib.rs"

[features]
default = ["bitmap-alloc"]
bitmap-alloc = []
segment-tree-alloc = []
buddy-alloc = []
vmstats = []
