[package]
name = "minix-vm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "minix-vm"
path = "src/main.rs"

[dependencies]
minix-types = { workspace = true }
minix-sys = { workspace = true }
# V11/T14: boot-proc ELF loading (exec_bootproc segment parsing);
# the same no_std parser boot-shim uses (loader.rs).
minix-elf = { workspace = true }
# E-VMMOCK (G-V12-5 余件): close the default-features leak — arch's
# `default = ["mock"]` must not enter the VM production build (kernel and
# boot-shim already opt out via the workspace table).
minix-arch = { path = "../../arch", default-features = false }
bitflags = { workspace = true }

[lib]
name = "minix_vm"
path = "src/lib.rs"

[features]
# V11/T16 (G-V11-2): C SANITYCHECKS 的 Rust 对应——编译期开启引用计数
# 全量校验的调用面（run_once 周期执行）。C: alloc.c/region.c SANITYCHECKS。
sanity_checks = []
default = ["bitmap_alloc"]
bitmap_alloc = []
segment_tree_alloc = []
buddy_alloc = []
vmstats = []
vm_acl_audit = []
