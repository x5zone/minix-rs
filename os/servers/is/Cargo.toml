[package]
name = "minix-is"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "minix-is"
path = "src/main.rs"

[dependencies]
minix-types = { workspace = true }
# E-ISKMESS：生产 KerninfoTransport 落地，按 V1-P2-1 的 forward-reference
# 约定加回实际消费的依赖。real-trap 由 boot image 构建开启（宿主构建保持
# -EIO fail-closed，与 minix-rt DirectTrapSource 同款门控）。
minix-sys = { workspace = true }

[lib]
name = "minix_is"
path = "src/lib.rs"
