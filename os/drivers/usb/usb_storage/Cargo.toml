[package]
name = "minix-driver-usb_storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "minix-driver-usb_storage"
path = "src/main.rs"

[dependencies]
minix-driver-rt = { workspace = true }
minix-blockdriver = { workspace = true }
minix-usb = { workspace = true }
minix-types = { workspace = true }
minix-sys = { workspace = true }

[lib]
name = "minix_driver_usb_storage"
path = "src/lib.rs"

# minix-rt 双 seam（与 tty/memory 同一契约）：
# - 宿主/测试取 std 形态：无 `_start` 也无 panic-handler，宿主二进制与
#   测试图都干净（Scrt1.o 入口）。
# - 真机（`target_os = "none"`，boot 装机模块）取 freestanding 形态：
#   `alloc-global` 把 rt 的池绑进 `#[global_allocator]`，`panic-handler`
#   取 rt 的统一 panic 面。feature 只在 none 门下出现，workspace 宿主图
#   统一特性时不会把 `#[panic_handler]` 漏进 std 构建。
[target.'cfg(not(target_os = "none"))'.dependencies]
minix-rt = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "none")'.dependencies]
minix-rt = { workspace = true, features = ["alloc-global", "panic-handler"] }
