 # minix-rs /etc/system.conf - the minimal dynamic-service config.
 #
 # The boot services carry their own rs_start rows in the boot image. This
 # file is read by minix-service up at runtime. The package and conf-dir
 # legs are absent in the imgrd image, so the default path is used.
 #
 # e5-spawned is the V20-P1-1 batch-1 service body. It prints one
 # kernel-console marker and parks in receive. The privilege set stays at
 # the C dstest shape from minix3/minix/tests/ds/system.conf. ipc ALL lets
 # its reply and any later probe message travel.

service e5-spawned
{
	system
		UMAP		# 14
	;
	ipc	ALL;
	uid	0;
};
