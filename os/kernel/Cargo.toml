[package]
name = "minix-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_kernel"
path = "src/lib.rs"

[dependencies]
minix-arch = { path = "../arch", default-features = false }
minix-plat = { path = "../plat" }
minix-platform = { workspace = true }
minix-types = { workspace = true }
minix-boot = { workspace = true }
bitflags = { workspace = true }

[dev-dependencies]
minix-arch = { path = "../arch", features = ["runtime-window"] }
minix-plat = { path = "../plat", features = ["mock"] }

[features]
# 形态开关（SD-30/U-1 已摘默认，NL5③ 生产开关显式化的延伸）：`default = []`——
# 不再有隐式形态。宿主测试腿走显式 `--features mock`（`mock` 传播 arch
# runtime-window、plat mock）；生产形态 = `--no-default-features`（真 arch/plat；
# riscv64gc/aarch64-unknown-none 判例见 NK8/NL5②），装机消费者 kernel-image 本就
# `default-features = false`。`qemu_test` 为载体侧追加位，与两形态正交。注意：摘默认后
# 裸 `cargo test -p minix-kernel` 会以生产形态编 test 目标而失败（引用仅 mock 形态存在的
# MockDirectMap 等），必须带 `--features mock`。
default = []
mock = ["minix-arch/runtime-window", "minix-plat/mock"]
qemu_test = []
# U-2（runqueues_ok 生产接线）：默认关。开则在 sched_enqueue/enqueue_head/dequeue
# 尾部对位 C `#if DEBUG_SANITYCHECKS assert(runqueues_ok_local())`（proc.c:1657/
# 1709/1778，proto.h:138 = runqueues_ok_cpu(cpuid)）做 fail-stop 队列不变量自检。
sanity-checks = []
