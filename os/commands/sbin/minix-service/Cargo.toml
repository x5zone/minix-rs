[package]
name = "minix-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_service"
path = "src/lib.rs"

[[bin]]
name = "minix-service"
path = "src/bin/minix-service.rs"

[dependencies]
minix-sys = { workspace = true }

# minix-rt 按目标分形态（fileops/NS12 seam 判例）：真机取 `_start` 出生链 +
# `alloc-global` slab 池 + `panic-handler`；宿主开发面取 std 形态。
[target.'cfg(not(target_os = "none"))'.dependencies]
minix-rt = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "none")'.dependencies]
minix-rt = { workspace = true, features = ["alloc-global", "panic-handler"] }
