[package]
name = "minix-mountinfo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_mountinfo"
path = "src/lib.rs"

[dependencies]
minix-fs-mfs = { path = "../../../fs/mfs" }

# POSIX 安装名是 `fsck.mfs`（带点）；cargo 的 bin 名不收点，构建名用
# 下划线，装机面（E-FSBDEV 之后的安装清单）改名或软链回 `fsck.mfs`。
[[bin]]
name = "fsck_mfs"
path = "src/bin/fsck_mfs.rs"
