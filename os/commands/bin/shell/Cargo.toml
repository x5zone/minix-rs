[package]
name = "minix-shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_shell"
path = "src/lib.rs"

# Dependencies serve the `src/bin/sh.rs` doing half; the library itself
# stays free of system-call imports (`exec_frame` is pure byte layout).
[dependencies]
minix-sys = { workspace = true }
# kerninfo 页类型（MinixKerninfo/KuserInfo）——sh 的栈顶查询用
# （init execve.rs 判例的 new_image_stack_top 同形）。
minix-types = { workspace = true }

# minix-rt 按目标分形态（fileops/NS12 seam 判例）：真机
# （x86_64-unknown-none，NS8 装机面的命令工件）取 `_start` 出生链 +
# `alloc-global` slab 池 + `panic-handler` 统一 panic 面；宿主开发面取
# std 形态。feature 只在各自门下出现，避免 E0152 死结。
[target.'cfg(not(target_os = "none"))'.dependencies]
minix-rt = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "none")'.dependencies]
minix-rt = { workspace = true, features = ["alloc-global", "panic-handler"] }
