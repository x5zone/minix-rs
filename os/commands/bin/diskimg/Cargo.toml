[package]
name = "minix-diskimg"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_diskimg"
path = "src/lib.rs"

[dependencies]
minix-sys = { workspace = true }

[[bin]]
name = "dd"
path = "src/bin/dd.rs"

# minix-rt 按目标分形态（fileops/NS12 seam 判例）：真机取 `_start` 出生链 +
# `alloc-global` slab 池 + `panic-handler`；宿主开发面取 std 形态（无
# `_start`、无 panic-handler，避免 E0152）。feature 只在各自门下出现。
[target.'cfg(not(target_os = "none"))'.dependencies]
minix-rt = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "none")'.dependencies]
minix-rt = { workspace = true, features = ["alloc-global", "panic-handler"] }
