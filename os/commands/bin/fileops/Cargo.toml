[package]
name = "minix-fileops"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_fileops"
path = "src/lib.rs"

# Dependencies serve the `src/bin/*.rs` doing halves; the library itself
# stays free of any system-call imports (pure deciding half).
[dependencies]
minix-sys = { workspace = true }
minix-rt = { workspace = true, features = ["std"] }
# The `:` operator of expr anchors a basic regular expression; the BRE
# engine is the 08-stage library (the C expr links libc's regcomp).
minix-regex = { workspace = true }
