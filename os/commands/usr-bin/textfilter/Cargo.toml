[package]
name = "minix-textfilter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "minix_textfilter"
path = "src/lib.rs"

# Dependencies serve the `src/bin/*.rs` doing halves; the library itself
# stays free of any system-call imports (pure deciding half).
[dependencies]
minix-sys = { workspace = true }
# `nl` 的 `p<regex>` 编号类型走语言侧现成的 BRE 引擎（`minix-regex`），
# 不另造一套匹配器。
minix-regex = { workspace = true }
# `src/digest.rs` 的 MD5 与 SHA1 走这一份现成的实现，不在命令面另译一遍
# （判据与出处见那个模块的模块头）。
minix-crypt = { workspace = true }
# `err(3)`/`warn(3)` 那一行的渲染与 errno 句子表住在 `minix-types`，但命令层不直引它：
# 本 crate 只走 `minix-sys` 顶层的同名再导出（`err_line`/`prog_name`），与 `fileops` 同形
# （边界守卫 `tools/check-command-boundary.sh`，判例：批次一百零九的 `df`）。

# minix-rt 按目标分形态（fileops/NS12 seam 判例）：无条件声明会把 std
# feature 统一进下游的 none 构建图，freestanding 侧 minix-rt 必须 no_std。
# feature 只在各自门下出现，宿主图统一特性时不会把 `#[panic_handler]`
# 漏进 std 构建（E0152 死结）。
[target.'cfg(not(target_os = "none"))'.dependencies]
minix-rt = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "none")'.dependencies]
minix-rt = { workspace = true, features = ["alloc-global", "panic-handler"] }
