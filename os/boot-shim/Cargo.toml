[package]
name = "boot-shim"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["uefi"]
uefi = ["dep:uefi", "dep:uefi-raw"]
opensbi = []
# Enable both impls for `cargo test` so loader/opensbi tests are built.
test-all = ["uefi", "opensbi"]
# X-2/NK5 裸机隔离：bin 是 no_std UEFI 镜像（自带 panic_handler/global_allocator），
# 宿主 `--workspace --bins` 必须跳过；真机构建成对传
# `--target <triple> --features fw-<arch>-uefi`（与 test-kernels 同词汇表）。
#
# `required-features` 是「全部必须开」的语义，一个 bin 不能让两个架构特性
# 各自打开同一个门（NK4-B P3 M3.2 在 kernel-image 上踩过同一坑）。做法：
# 抽出架构无关的内部特性 `fw-uefi-image` 由 bin 要求，`fw-x86-uefi` 与
# `fw-aarch64-uefi` 都隐含它。对外零变化：`os/xtask/src/image.rs` 仍只传
# `--features fw-x86-uefi`；riscv64 若走 UEFI（P4 目前走 OpenSBI，不用本
# 词汇）可同形扩展。`fw-uefi-image` 单独打开也自洽（它隐含 `uefi`，而
# `uefi` 就是 `main.rs`/`uefi_helpers` 需要的全部），不像 kernel-image 那个
# 内部特性那样存在「打开但缺依赖」的组合。
fw-uefi-image = ["uefi"]
fw-x86-uefi = ["fw-uefi-image"]
fw-aarch64-uefi = ["fw-uefi-image"]
# D-73: the riscv64 U-Boot leg. `bootelf -p <img> <table_addr>` hands over
# with `(extra_argc, extra_argv)` in a0/a1 (probe-verified 2026-10-31); the
# bin is physically linked (VMA=LMA, own bootstrap stack) and produces the
# frozen `BootHandoffV1` envelope for the `kernel-uboot` receiver image.
fw-riscv-uboot = ["opensbi"]

[dependencies]
# I-22 丁案 C：opensbi/U-Boot 腿 memmap 源=DTB（DtbMemoryMap 消费），
# 解析在 boot-shim 侧完成（版本钉见工作区 SD-38 注）。
fdt = { workspace = true }
minix-types = { path = "../libs/minix-types" }
minix-boot = { path = "../libs/minix-boot" }
minix-arch = { path = "../arch", default-features = false }
minix-kernel = { path = "../kernel", default-features = false }
# 交棒后（ExitBootServices 之后）的裸串口通道：PL011 寄存器语义与发送节流
# 住在 minix-plat 的 early_console 里，aarch64 腿直接复用（NK4-B P3 M3.3）。
# x86_64 腿不依赖它——COM1 端口写仍在 `src/lib.rs` 里，逐字未变。
minix-plat = { path = "../plat", default-features = false }
minix-elf = { path = "../libs/minix-elf" }
# Note: we do NOT enable uefi's "global_allocator" feature here.
# In production, the UEFI allocator is set up in main.rs.
# In tests, we provide std::alloc::System as the global allocator.
uefi = { version = "0.33", optional = true, features = ["alloc"] }
# Raw boot-services table for the T1 pairing loop. `uefi` keeps its own
# `uefi_raw` private, so the raw ABI types (BootServices fields, Status) must
# come from a direct dependency pinned to the same version.
uefi-raw = { version = "0.9", optional = true }

[lib]
test = true

[[bin]]
name = "boot-shim"
test = false
required-features = ["fw-uefi-image"]

# D-73: the riscv64 U-Boot receiver-side shim. Physically linked
# (riscv64-uboot.ld, VMA=LMA=0x84500000 — inside the bdinfo/lmb free band
# 0x80060000-0x8dea9fff, outside the bump/module region 0x82000000-0x84000000
# and every staged file), entered by `bootelf -p` with `a0/a1` =
# `(extra_argc, extra_argv)`; it consumes the MNXBOOT1 table and produces the
# frozen `BootHandoffV1` arena for the `kernel-uboot` receiver image.
[[bin]]
name = "riscv64-uboot-shim"
path = "src/uboot_main.rs"
test = false
required-features = ["fw-riscv-uboot"]
